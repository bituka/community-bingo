<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Bingo — Ball Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
</svg>

<div class="grain-overlay" aria-hidden="true"></div>

<header class="marquee">
  <div class="marquee-inner">
    <span class="deco" aria-hidden="true">&#10022; &#10022; &#10022;</span>
    <h3><span id="communityName">Community</span> Bingo <button class="edit-title-btn" id="editCommunityName" type="button" aria-label="Change community name">Edit</button></h3>
    <span class="deco" aria-hidden="true">&#10022; &#10022; &#10022;</span>
  </div>
  <form class="community-name-form" id="communityNameForm" hidden>
    <label for="communityNameInput">Community name</label>
    <input id="communityNameInput" type="text" maxlength="40" required>
    <button class="btn btn-ghost" type="submit">Save</button>
    <button class="btn btn-ghost" id="cancelCommunityName" type="button">Cancel</button>
  </form>
  <p class="tagline">Seventy-five balls. One caller.</p>
</header>

<main class="hall">

  <section class="stage" aria-label="Current call">
    <div class="machine">
      <div class="ball-tray" id="ballTray">
        <div class="ball empty" id="currentBall">
          <span class="ball-letter">&ndash;</span>
          <span class="ball-number">&ndash;</span>
        </div>
      </div>
      <div class="callout" id="callout">Enter a ball number (1-75) to start</div>
    </div>

    <section class="card-panel" aria-label="Game pattern card">
      <h2 class="card-title">Game pattern</h2>
      <p class="card-hint">Tap cells to mark the winning pattern for this game</p>
      <div class="card-head">
        <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
      </div>
      <div class="card-grid" id="cardGrid"></div>
      <div class="card-actions">
        <button class="btn btn-ghost" id="clearPatternBtn">Clear pattern</button>
      </div>
    </section>

    <div class="controls">
      <button class="btn btn-ghost" id="resetBtn">New game</button>
      <div class="manual-input" style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.5rem;">
        <input type="text" id="ballNumberInput" placeholder="e.g., 52 or G-52" 
               style="flex: 1; padding: 0.5rem; border: 1px solid rgba(244,236,216,0.3); border-radius: 6px; background: rgba(0,0,0,0.2); color: var(--cream);"
               maxlength="10">
        <button id="addBallBtn" class="btn btn-ghost" style="padding: 0.5rem 0.8rem;">Add</button>
      </div>
    </div>

    <div class="history" aria-label="Called balls by letter">
      <h2 class="history-title">Called numbers</h2>
      <div class="history-groups" id="history">
        <div class="hist-group" data-letter="B"><span class="hist-letter">B</span><ol class="hist-list"></ol></div>
        <div class="hist-group" data-letter="I"><span class="hist-letter">I</span><ol class="hist-list"></ol></div>
        <div class="hist-group" data-letter="N"><span class="hist-letter">N</span><ol class="hist-list"></ol></div>
        <div class="hist-group" data-letter="G"><span class="hist-letter">G</span><ol class="hist-list"></ol></div>
        <div class="hist-group" data-letter="O"><span class="hist-letter">O</span><ol class="hist-list"></ol></div>
      </div>
    </div>
  </section>

</main>

<footer class="ledger">
  <span id="drawCount">0 of 75 drawn</span>
  <span id="statusMsg">Enter a ball number (1-75)</span>
</footer>

<script src="script.js"></script>

</body>
</html>
